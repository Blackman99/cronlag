# Dogfood: a tiny hourly schedule whose lag cronlag measures (CI "live" job and the landing page).
name: probe

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: guard
        uses: ./
        with:
          mode: guard
      - name: lag of this run
        run: echo "slot=${{ steps.guard.outputs.slot }} lag=${{ steps.guard.outputs.lag-minutes }}m skip=${{ steps.guard.outputs.skip }}"
